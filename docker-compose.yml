services:
  rpg-postgres:
    image: postgres:16-alpine
    container_name: rpg-postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT}:5432"
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - local-db

  rpg-api:
    build:
      context: ./student-fee-poc/dotnet/student-fee-poc
      dockerfile: Dockerfile
    container_name: rpg-api
    restart: unless-stopped
    ports:
      - "${API_PORT}:8080"
    environment:
      - ConnectionStrings__Postgres=Host=host.docker.internal;Port=${PG_PORT};Database=${PG_DB};Username=${PG_USER};Password=${PG_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rpg-migrator:
    build:
      context: .
      dockerfile: ./scripts/Dockerfile
    container_name: rpg-migrator
    env_file:
      - .env
    environment:
      - PG_HOST=host.docker.internal
      - PG_PORT=${PG_PORT}
      - RAVEN_CERT_FILE=/app/scripts/${RAVEN_CERT_FILE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - migration
      - tools

  rpg-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0-preview
    container_name: rpg-tests
    volumes:
      - ./student-fee-poc:/app
    working_dir: /app/dotnet/student-fee-poc-tests
    environment:
      - ConnectionStrings__Postgres=Host=host.docker.internal;Port=${PG_PORT};Database=${PG_DB};Username=${PG_USER};Password=${PG_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["dotnet", "test"]
    profiles:
      - test
      - tools

volumes:
  postgres_data:
